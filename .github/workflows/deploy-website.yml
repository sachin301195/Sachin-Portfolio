name: Deploy Website to AWS S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'website/**' # Only run if changes are made within the /website directory

  workflow_dispatch: # Allows to trigger this workflow manually from the Actions tab in GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "ca-central-1"
      S3_BUCKET_NAME: "sachinbulchandani-portfolio"

    defaults: # Add defaults to specify working directory for subsequent steps
      run:
        working-directory: ./website # Set the working directory to ./website

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and Build Tailwind CSS
        # working-directory: ./website 
        run: |
          npm ci 
          npm run build:tailwind
          echo "Tailwind CSS build complete."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static site to S3
        # working-directory: ./website
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }} --delete 
          echo "Deployment to S3 complete."
        
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "CloudFront invalidation complete."